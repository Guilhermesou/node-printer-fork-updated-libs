name: Prebuild Binaries and Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  prebuild:
    name: Prebuild on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: macos-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: windows-latest
            arch: x64
          - os: windows-latest
            arch: x86

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcups2-dev

      - name: Install JS dependencies
        run: npm install

      - name: Build and Upload Prebuild
        shell: bash
        run: |
          npm run prebuild -- --napi --arch ${{ matrix.arch }} --strip -u ${{ secrets.PREBUILD_TOKEN }}
